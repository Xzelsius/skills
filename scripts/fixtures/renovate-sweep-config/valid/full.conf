# Sets every key. Section and key names are case-insensitive, and a later rule wins over an earlier one.
[sweep]
    bot = my-renovate[bot]
    mergeMethod = squash
    verify = "dotnet build; dotnet test"

[dependency "Microsoft.Extensions.*"]
    consumerFacing = true

[dependency "Microsoft.Extensions.Logging.Abstractions"]
    consumerFacing = false

[Dependency "@types/*"]
    ConsumerFacing = no
